
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>原始网页</title>
    <style>
        body {
          padding: 40px;
          font-size: 18px;
        }

        /* 浅色样式 */
        @media (prefers-color-scheme: light) {
          body { background: LightBlue; color: red; }
        }

        /* 深色样式 */
        @media (prefers-color-scheme: dark) {
          body { background: yellow; color: Brown; }
        }
    </style>
</head>
<body>
<h3>原始测试页面</h3>
<p>深色模式测试</p>
</body>
</html>
