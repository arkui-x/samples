<!DOCTYPE html>
<html>
<head>
  <title>Main Window</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html { font-size: 18px; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; line-height: 1.4; padding: 16px; }
    h1 { font-size: 1.6rem; margin-bottom: 0.75rem; }
    p { font-size: 1rem; }
    button { font-size: 1rem; padding: 12px 20px; min-width: 140px; min-height: 44px; border-radius: 8px; cursor: pointer; }
    /* 增加按钮间距以便触控 */
    button + button, button + a { margin-left: 8px; }
  </style>
</head>
<body>
<h1>Main Window</h1>
<button onclick="openNewWindow()">Open New Window</button>

<script>
  function openNewWindow() {
      // 打开一个新窗口
      let newWindow = window.open('newWindow.html', '_blank');
  }
</script>
</body>
</html>
